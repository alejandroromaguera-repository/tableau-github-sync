name: Sincronizar Tableau Online -> GitHub

on:
  # Disparador manual desde GitHub UI
  workflow_dispatch:

    # Sincronización automática diariamente (2 AM)
    #schedule:
    #  - cron: '0 2 * * *'

jobs:
  sync-tableau:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Descargar script de sincronización
        run: |
          # Si el script ya está en el repositorio, saltarse este paso
          if [ ! -f "scripts/tableau_github_sync.py" ]; then
            mkdir -p scripts
            curl -o scripts/tableau_github_sync.py https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/tableau_github_sync.py
            chmod +x scripts/tableau_github_sync.py
          fi

      - name: Ejecutar sincronización Tableau -> GitHub
        env:
          # Credenciales de Tableau Online
          TABLEAU_SERVER: ${{ secrets.TABLEAU_SERVER }}
          TABLEAU_SITE: ${{ secrets.TABLEAU_SITE }}
          TABLEAU_USERNAME: ${{ secrets.TABLEAU_USERNAME }}
          TABLEAU_PASSWORD: ${{ secrets.TABLEAU_PASSWORD }}

          # Crdenciales de GitHub
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/tableau_github_sync.py

      - name: Subir artefactos (workbooks descargados)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tableau-workbooks
          path: tableau-workbooks/
          retention-days: 30

      - name: Notificar en caso de error
        if: failure()
        run: |
          echo "Error en la sincronización de Tableau"
          exit 1

  # Paso adicional: validar integridad de archivos
  validate:
    needs: sync-tableau
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name:  Validar archivos .twbx
        run: |
          echo "Validando archivos .twbx en el repositorio..."

          if [ -d "workbooks" ]; then
            count=$(find workbooks -name "*.twbx" | wc -1)
            echo " Se encontraron $count archivos .twbx"
          else
            echo "Directorio 'workbooks' no encontrado"
          fi
